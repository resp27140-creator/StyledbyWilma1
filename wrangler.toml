name = "styled-by-wilma-api"
main = "server.ts"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "styled-by-wilma-db"
database_id = "styled-by-wilma-primary-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "styled-by-wilma-images"

[vars]
FIREBASE_PROJECT_ID = "styled-by-wilma"
APP_NAME = "Styled By Wilma"
DEFAULT_MODEL = "gemini-3.8-flash"
